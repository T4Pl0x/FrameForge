name: FrameForge Publish

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [frameforge_publish, frameforge_override_publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Dump payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "client_payload: $PAYLOAD"
      - name: Summary
        run: |
          echo "Publish workflow triggered for repo: $GITHUB_REPOSITORY" >> $GITHUB_STEP_SUMMARY
          echo "Event: $GITHUB_EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY

