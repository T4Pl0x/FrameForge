name: Spec Validate
on:
  pull_request:
    # run on all PRs to catch cross-file coupling
  workflow_dispatch:
  push:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: spec-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check validator path exists
        run: |
          ls -la frameforge/scripts
          test -f frameforge/scripts/validate-spec.mjs
      - name: Show commit context
        run: |
          echo "HEAD: $(git rev-parse HEAD)" && git --no-pager log --oneline -n 3
      - name: Validate spec
        run: npm run validate:spec
      - name: Check generated anchors
        run: node tools/check-anchors.js
