name: Spec Validate
on:
  pull_request:
    paths:
      - 'spec/**'
      - 'schemas/**'
      - 'shared/schema/**'
      - '.github/workflows/spec-validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate spec
        run: npm run validate:spec
      - name: Check generated anchors
        run: node tools/check-anchors.js
