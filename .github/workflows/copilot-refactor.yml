name: Copilot Refactor Agent

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without applying code changes'
        required: false
        default: 'true'
      apply:
        description: 'Emit reports and enable automated refactors'
        required: false
        default: 'false'
      hotspot-threshold:
        description: 'Line count threshold for hotspot detection'
        required: false
        default: '250'
  schedule:
    - cron: '30 2 * * *'
  issue_comment:
    types:
      - created
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write
  issues: read
  statuses: write

jobs:
  run-agent:
    if: >-
      github.event_name != 'issue_comment' || contains(github.event.comment.body, '/copilot-refactor')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          corepack enable
          npm install

      - name: Run refactor agent (dry run)
        id: agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/refactor-agent.js --branch=${{ github.ref_name }} --dry-run=${{ github.event.inputs.dry-run || 'true' }} --apply=${{ github.event.inputs.apply || 'false' }} --hotspot-threshold=${{ github.event.inputs.hotspot-threshold || '250' }}

      - name: Upload reflection artefact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-reflection-${{ github.run_id }}
          path: .copilot/plans

      - name: Post comment with summary
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const plansDir = path.join(process.cwd(), '.copilot', 'plans');
            const files = fs.readdirSync(plansDir);
            if (files.length === 0) {
              core.info('No reflection files generated.');
              return;
            }
            const latest = files.sort().pop();
            const body = fs.readFileSync(path.join(plansDir, latest), 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Refactor agent run complete. Reflection file: ${latest}\n\n\`\`\`\n${body}\n\`\`\``,
            });
