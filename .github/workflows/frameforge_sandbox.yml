name: FrameForge Sandbox

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [frameforge_sandbox]

jobs:
  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install (optional)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "no lockfile, skipping"; fi

      - name: Generate normalized reports (minimal)
        run: |
          node -e "require('fs').writeFileSync('tests-report.json', JSON.stringify({summary:{passed:0,failed:0,skipped:0,total:0,durationMs:0}},null,2))"
          node -e "require('fs').writeFileSync('a11y-report.json', JSON.stringify({violations:0,passes:0,inapplicable:0},null,2))"
          node -e "require('fs').writeFileSync('lint-build.json', JSON.stringify({lintErrors:0,lintWarnings:0,buildErrors:0,buildWarnings:0},null,2))"

      - name: Upload tests-report.json
        uses: actions/upload-artifact@v4
        with:
          name: tests-report.json
          path: tests-report.json

      - name: Upload a11y-report.json
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report.json
          path: a11y-report.json

      - name: Upload lint-build.json
        uses: actions/upload-artifact@v4
        with:
          name: lint-build.json
          path: lint-build.json

